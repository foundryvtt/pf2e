name: Project CI

on:
  pull_request:
    branches: [v13-dev, v14-dev]
  push:
    branches: [v13-dev, v14-dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true

      - name: Build
        run: |
          pnpm build --system=pf2e
          pnpm build:packs --system=sf2e

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true

      - name: Test
        run: pnpm test

  # Covers .ts and .svelte files, so the build job skips its own type check
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true

      - name: Typecheck
        run: pnpm check
